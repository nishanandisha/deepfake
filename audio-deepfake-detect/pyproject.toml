[project]
name = "audio-deepfake-detect"
version = "0.1.0"
description = "Explainable audio-only deepfake detection (acoustic branch)"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end training-loop tests, slower than unit tests but still run by default"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
